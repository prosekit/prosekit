packages:
  - website
  - registry
  - packages/*

catalog:
  "@tsdown/css": "^0.23.0"
  "@types/node": "^24.12.2"
  "@vitest/browser-playwright": "^5.0.3"
  "@vitest/coverage-v8": "^5.0.3"
  "@vitest/ui": "^5.0.3"
  tsdown: "^0.23.0"
  typescript: "~6.0.3"
  vitest: "^5.0.3"

dedupePeers: true

ignoreWorkspaceRootCheck: true

allowBuilds:
  "@parcel/watcher": false
  dprint: false
  esbuild: false
  simple-git-hooks: false
  workerd: false

patchedDependencies:
  y-prosemirror: patches/y-prosemirror.patch

strictDepBuilds: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    "vitest-browser-solid>vitest": "5"

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - "starlight-theme-nova"
  - "@aria-ui/*"
  - "@ocavue/*"
  - "@prosemirror-adapter/*"
  - "prosemirror-view"
  - "prosemirror-highlight"
  - "prosemirror-flat-list"

# Temporary: test unreleased @aria-ui changes from pkg.pr.new. Remove after the release.
blockExoticSubdeps: false
overrides:
  "@aria-ui/core": https://pkg.pr.new/ocavue/aria-ui/@aria-ui/core@3423057
  "@aria-ui/elements": https://pkg.pr.new/ocavue/aria-ui/@aria-ui/elements@3423057
  "@aria-ui/utils": https://pkg.pr.new/ocavue/aria-ui/@aria-ui/utils@3423057
