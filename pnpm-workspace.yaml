packages:
  - website
  - registry
  - packages/*

catalog:
  "@tsdown/css": "^0.23.1"
  "@types/node": "^24.12.2"
  "@vitest/browser-playwright": "^5.0.5"
  "@vitest/coverage-v8": "^5.0.5"
  "@vitest/ui": "^5.0.5"
  tsdown: "^0.23.1"
  typescript: "~6.0.3"
  vitest: "^5.0.5"

dedupePeers: true

ignoreWorkspaceRootCheck: true

allowBuilds:
  "@parcel/watcher": false
  dprint: false
  esbuild: false
  simple-git-hooks: false
  workerd: false

patchedDependencies:
  y-prosemirror: patches/y-prosemirror.patch

strictDepBuilds: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    "vitest-browser-solid>vitest": "5"
  allowAny:
    - "oxc-transform-react"

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - "starlight-theme-nova"
  - "@aria-ui/*"
  - "@ocavue/*"
  - "@prosemirror-adapter/*"
  - "prosemirror-view"
  - "prosemirror-highlight"
  - "prosemirror-flat-list"
  - eslint-plugin-unicorn@79.0.0
