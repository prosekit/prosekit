packages:
  - website
  - registry
  - packages/*

catalog:
  "@tsdown/css": "^0.22.14"
  "@types/node": "^24.12.2"
  "@vitest/browser-playwright": "^4.1.11"
  "@vitest/coverage-v8": "^4.1.11"
  "@vitest/ui": "^4.1.11"
  tsdown: "^0.22.14"
  typescript: "~6.0.3"
  vitest: "^4.1.11"

dedupePeers: true

ignoreWorkspaceRootCheck: true

allowBuilds:
  "@parcel/watcher": false
  dprint: false
  esbuild: false
  simple-git-hooks: false
  workerd: false

patchedDependencies:
  y-prosemirror: patches/y-prosemirror.patch

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - "starlight-theme-nova"
  - "@aria-ui/*"
  - "@ocavue/*"
  - "@prosemirror-adapter/*"
  - "prosemirror-view"
  - "prosemirror-highlight"
  - happy-dom@20.12.0
  - astro@7.3.1
  - satteri-custom-header-id@0.1.1
