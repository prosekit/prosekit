name: hide-bot-comment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  hide-bot-comment:
    runs-on: ubuntu-latest

    steps:
      - id: hide-comment
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: int128/hide-comment-action@cfb4701b8e28a3a3ebc38c017225c5c7466bf7b1 # v1.72.0
        with:
          authors: |
            github-actions
            changeset-bot
            coderabbitai
            pkg-pr-new
